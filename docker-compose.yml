# Vollständiger Betrieb mit SQL Server. Passwörter kommen aus .env (Kopie von .env.example) und sind nicht in Git.
#   docker compose up --build    →  http://localhost:8080
# In Production gehört ein Reverse Proxy mit TLS (Caddy/Nginx) davor; Sitzungs-Cookies werden nur über HTTPS gesendet.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Nur auf diesem Server offen; ein Reverse Proxy (Caddy/Nginx) mit TLS sitzt davor.
    # Niemals "8080:8080" setzen: sonst umgeht jeder mit gefälschtem X-Forwarded-For das Rate-Limit.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Production: Bei Demo- oder unsicheren Einstellungen startet die App nicht. Für eine interne Demo: APP_ENV=Staging
      ASPNETCORE_ENVIRONMENT: ${APP_ENV:-Production}
      AllowedHosts: ${SITE_HOSTS:-}
      Database__Provider: SqlServer
      ConnectionStrings__Default: "Server=db;Database=GymPlatform;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY in .env setzen}
      Otp__Pepper: ${OTP_PEPPER:?OTP_PEPPER in .env setzen}
      Otp__ExposeCodeInResponse: ${OTP_EXPOSE_CODE:-false}
      Sms__Provider: ${SMS_PROVIDER:-Kavenegar}
      Sms__Kavenegar__ApiKey: ${KAVENEGAR_API_KEY:-}
      Sms__SiteUrl: ${SMS_SITE_URL:-}
      Payment__UseVirtualGateway: ${PAYMENT_SANDBOX:-false}
      Payment__CallbackBaseUrl: ${SITE_URL:-}
      Payment__ZarinPal__MerchantId: ${ZARINPAL_MERCHANT_ID:-}
      ReverseProxy__Enabled: ${BEHIND_PROXY:-true}
      Storage__PublicUploads: /data/uploads
    volumes:
      - private:/data/private
      # Bilder, die der Admin für Speisekarte, Produkte und Pakete hochlädt
      - uploads:/data/uploads
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  sqldata:
  private:
  uploads:
